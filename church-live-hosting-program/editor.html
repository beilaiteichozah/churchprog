<!DOCTYPE html>
<html lang="en" data-editor>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editor Dashboard</title>
  <meta name="description" content="Edit the church details, program, lower-third names and songs, stored as JSON.">
  <link rel="stylesheet" href="editor.css">
  <script src="data.js"></script>
</head>
<body>

<header class="top">
  <div class="brand">
    <i class="mark" aria-hidden="true"></i>
    <div><strong>Editor Dashboard</strong><span id="churchName">Church Live Hosting Program</span></div>
  </div>
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div class="actions">
    <button type="button" id="btnConnect" class="ghost" hidden>Connect folder</button>
    <button type="button" id="btnSave" class="primary" title="Save (Ctrl + S)">Save</button>
  </div>
</header>

<div class="layout">
  <nav class="tabs" id="tabs" aria-label="Sections">
    <button type="button" data-tab="church">Church &amp; event</button>
    <button type="button" data-tab="colours">Colours</button>
    <button type="button" data-tab="program">Program <span class="count" id="cProgram"></span></button>
    <button type="button" data-tab="lower">Lower thirds <span class="count" id="cLower"></span></button>
    <button type="button" data-tab="songs">Songs <span class="count" id="cSongs"></span></button>
    <button type="button" data-tab="files">Files &amp; preview</button>
  </nav>
  <main id="panel" tabindex="-1"></main>
</div>

<div id="toast" class="toast" role="status"></div>

<dialog id="dlg"></dialog>
<input type="file" id="importInput" accept=".json,application/json" multiple hidden>

<script src="editor.js"></script>
</body>
</html>
